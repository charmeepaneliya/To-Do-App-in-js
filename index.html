<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div
      class="contaimer d-flex justify-content-center align-items-center vh-100">
      <div class="card p-5 rounded-5" style="width: 65rem">
        <div class="card-body d-flex justify-content-around">
          <div class="border p-5 shadow rounded-5 bg-white">
            <h4 class="text-center p-2">To-Do List</h4>
            <input
              class="p-2 w-100 rounded border-1"
              type="text"
              id="task"
              placeholder="Enter task"
            />
            <br /><br />
            <input
              type="text"
              class="p-2 w-100 rounded border-1"
              id="des"
              placeholder="Enter description"
            />
            <br /><br />
            <select id="priority" class="p-2 w-100 rounded">
                <option value="">select priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
            <br><br>
            <button class="btn btn-outline-primary w-100" onclick="addTask()">
              Add Task
            </button>
            <br /><br />

            <select id="filter" class="p-2 w-100 rounded">
                <option value="">filter priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
          </div>


          <div class="border p-5 shadow rounded-5 bg-white">
             <!-- table -->
          <table class="table text-center">
            <thead>
              <tr>
                <th>No</th>
                <th>Task</th>
                <th>description</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
          </div>
         
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
